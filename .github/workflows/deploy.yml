name: Django Blog CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          python manage.py check

      - name: Test SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions-deploy
          chmod 600 ~/.ssh/github-actions-deploy
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github-actions-deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "echo 'SSH connection successful'"
      - name: Pull latest code on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github-actions-deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/django-blog && git pull origin main"
      - name: Update dependencies on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github-actions-deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/django-blog && source venv/bin/activate && pip install -r requirements.txt"
      - name: Restart Gunicorn
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github-actions-deploy \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart gunicorn"
